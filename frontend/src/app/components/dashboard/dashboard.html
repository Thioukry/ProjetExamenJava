<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-journal-check me-2"></i>SunuXam
    </a>
    <button class="btn btn-outline-light btn-sm" (click)="onLogout()">
      <i class="bi bi-power me-1"></i>Déconnexion
    </button>
  </div>
</nav>

<div class="container mt-4">
  <div class="card bg-light border-0 shadow-sm rounded-3 p-3 mb-4">
    <div class="d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <i class="bi bi-person-circle display-6 text-primary me-3"></i>
        <div>
          <h5 class="mb-0 fw-bold">{{ user?.sub }}</h5>
          <small class="text-muted">Session active • Plateforme SunuXam</small>
        </div>
      </div>
      <span class="badge bg-secondary px-3 py-2 fs-6" *ngIf="user?.role || user?.roles">
        <i class="bi bi-shield-lock me-1"></i>
        {{ user?.role || user?.roles }}
      </span>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-dark mb-0">
      <i class="bi bi-file-earmark-text me-2"></i>Examens
    </h4>
    <a *ngIf="isAdmin" routerLink="/examens/nouveau" class="btn btn-success btn-sm fw-bold">
      <i class="bi bi-plus-lg me-1"></i>Créer un examen
    </a>
  </div>


  <div *ngIf="errorMessage" class="alert alert-danger text-center shadow-sm">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    {{ errorMessage }}
  </div>


  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Chargement des épreuves...</p>
  </div>


  <div *ngIf="!loading && !errorMessage && examens.length === 0" class="alert alert-info text-center">
    Aucun examen disponible pour le moment.
  </div>


  <div class="row" *ngIf="!loading && !errorMessage && examens.length > 0">
    <div class="col-md-4 mb-3" *ngFor="let ex of examens">
      <div class="card h-100 shadow-sm border-0 rounded-3">
        <div class="card-body">
          <span class="badge bg-primary float-end">{{ ex.dureeMinutes }} min</span>
          <h5 class="card-title fw-bold text-primary">{{ ex.titre }}</h5>
          <p class="card-text text-secondary small">{{ ex.description }}</p>
        </div>
        <div class="card-footer bg-transparent border-0 pb-3 d-flex gap-2">
          <button *ngIf="!isAdmin" class="btn btn-outline-primary w-100 btn-sm fw-bold">
            Passer l'examen
          </button>
          <button *ngIf="isAdmin" (click)="onDelete(ex.id)" class="btn btn-outline-danger w-100 btn-sm fw-bold">
            Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
