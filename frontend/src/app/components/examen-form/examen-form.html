<nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-plus-circle me-2"></i>SunuXam - Nouvel Examen
    </span>
  </div>
</nav>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
          <h4 class="card-title fw-bold text-primary mb-3">Créer un examen</h4>

          <div *ngIf="errorMessage" class="alert alert-danger py-2">
            {{ errorMessage }}
          </div>

          <form [formGroup]="examenForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-semibold">Titre de l'examen</label>
              <input type="text" formControlName="titre" class="form-control" placeholder="ex: BD Oracle & PL/SQL">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description</label>
              <textarea formControlName="description" class="form-control" rows="3" placeholder="Description des consignes..."></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Durée (en minutes)</label>
                <input type="number" formControlName="dureeMinutes" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Statut</label>
                <select formControlName="statut" class="form-select">
                  <option value="OUVERT">OUVERT</option>
                  <option value="FERME">FERME</option>
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" (click)="onCancel()" class="btn btn-outline-secondary">Annuler</button>
              <button type="submit" [disabled]="examenForm.invalid || loading" class="btn btn-primary fw-bold">
                <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span> Enregistrer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
