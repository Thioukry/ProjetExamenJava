<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 420px;">

    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill text-primary display-4"></i>
      <h3 class="fw-bold mt-2">Espace Connexion</h3>
      <p class="text-muted small">Accédez à votre compte pour continuer</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ errorMessage }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label font-monospace fw-semibold">Adresse Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" [(ngModel)]="credentials.email" name="email" placeholder="nom@exemple.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label font-monospace fw-semibold">Mot de passe</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" [(ngModel)]="credentials.motDePasse" name="motDePasse" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm">
        <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
      </button>
    </form>

    <div class="text-center mt-4 border-top pt-3">
      <span class="text-muted small">Vous n'avez pas encore de compte ?</span><br>
      <a routerLink="/register" class="text-decoration-none fw-bold">Créer un compte</a>
    </div>

  </div>
</div>
